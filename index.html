<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gatos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .gato-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .gato-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        .gato-img {
            height: 180px;
            object-fit: cover;
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }
        #resultado {
            display: none;
        }
        #preview {
            max-width: 100%;
            max-height: 180px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4 px-3 px-md-4">
        <div class="row g-4">

            <!-- ========== FORMULARIO (izquierda) ========== -->
            <div class="col-12 col-lg-4">
                <div class="card p-4">
                    <h2 class="text-center mb-4">Registro de Gato</h2>

                    <form id="formGato">
                        <!-- Campo oculto para saber si estamos editando -->
                        <input type="hidden" id="gatoId" value="">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" required placeholder="Ej: Michi">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Edad (años)</label>
                            <input type="number" class="form-control" id="edad" required min="0" step="0.1" placeholder="Ej: 2.5">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Peso (kg)</label>
                            <input type="number" class="form-control" id="peso" required min="0" step="0.1" placeholder="Ej: 4.2">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Raza</label>
                            <input type="text" class="form-control" id="raza" required placeholder="Ej: Siames">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Imagen del gato</label>
                            <input type="file" class="form-control" id="imagen" accept="image/*">
                            <img id="preview" alt="Vista previa">
                            <small class="text-muted" id="ayudaImagen">
                                Al editar, si no seleccionas una nueva imagen se mantiene la actual.
                            </small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="btnSubmit">
                            Registrar Gato
                        </button>
                        <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="btnCancelar">
                            Cancelar edición
                        </button>
                    </form>

                    <div id="resultado" class="alert mt-4" role="alert"></div>
                </div>
            </div>

            <!-- ========== TARJETAS DE GATOS (derecha) ========== -->
            <div class="col-12 col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">Gatos Registrados</h2>
                    <button class="btn btn-outline-secondary btn-sm" id="btnRecargar">
                        Actualizar
                    </button>
                </div>
                <div id="listaGatos" class="row g-3">
                    <div class="col-12 loading">Cargando gatos...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL de tu backend en Render (sin /gato al final)
        const BACKEND_URL = "https://guia-de-trabajo-3-9t2e.onrender.com";

        // Gatos cargados, para buscarlos por id al pulsar "Actualizar"
        let gatosCargados = [];

        // Evita que un nombre con < o " rompa la página
        function escaparHtml(texto) {
            return String(texto ?? "").replace(/[&<>"']/g, (c) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
            }[c]));
        }

        // ========== Vista previa de la imagen seleccionada ==========
        document.getElementById("imagen").addEventListener("change", (e) => {
            const file = e.target.files[0];
            const preview = document.getElementById("preview");
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            } else {
                preview.src = "";
                preview.style.display = "none";
            }
        });

        // ========== Mostrar mensaje ==========
        function mostrarMensaje(texto, tipo) {
            const resultadoDiv = document.getElementById("resultado");
            resultadoDiv.className = `alert alert-${tipo} mt-4`;
            resultadoDiv.textContent = texto;
            resultadoDiv.style.display = "block";
        }

        // ========== Cargar datos de un gato en el formulario ==========
        function editarGato(gato) {
            document.getElementById("gatoId").value = gato.id;
            document.getElementById("nombre").value = gato.nombre;
            document.getElementById("edad").value = gato.edad;
            document.getElementById("peso").value = gato.peso;
            document.getElementById("raza").value = gato.raza;

            // No cargamos la imagen en el input file (no se puede por seguridad del navegador)
            document.getElementById("imagen").value = "";
            document.getElementById("preview").style.display = "none";

            // Mostrar botón cancelar y cambiar el texto del botón principal
            document.getElementById("btnCancelar").classList.remove("d-none");
            document.getElementById("btnSubmit").textContent = "Guardar cambios";

            // Scroll suave al formulario
            document.querySelector(".card").scrollIntoView({ behavior: "smooth" });
        }

        // ========== Eliminar gato ==========
        async function eliminarGato(id, nombre) {
            const confirmar = confirm(`¿Seguro que deseas eliminar a "${nombre}"? Esta acción no se puede deshacer.`);
            if (!confirmar) return;

            try {
                const respuesta = await fetch(`${BACKEND_URL}/gato/${id}`, {
                    method: "DELETE",
                });

                const data = await respuesta.json();

                if (!respuesta.ok) {
                    mostrarMensaje(data.mensaje || "Error al eliminar el gato", "danger");
                    return;
                }

                mostrarMensaje(data.mensaje, "success");

                // Si estábamos editando justo el gato eliminado, limpiamos el formulario
                if (document.getElementById("gatoId").value === id) {
                    limpiarFormulario();
                }

                cargarGatos();
            } catch (error) {
                console.error(error);
                mostrarMensaje("Error de conexión con el servidor.", "danger");
            }
        }

        // ========== Limpiar formulario ==========
        function limpiarFormulario() {
            document.getElementById("formGato").reset();
            document.getElementById("gatoId").value = "";
            document.getElementById("preview").style.display = "none";
            document.getElementById("btnCancelar").classList.add("d-none");
            document.getElementById("btnSubmit").textContent = "Registrar Gato";
        }

        // Botón Cancelar edición
        document.getElementById("btnCancelar").addEventListener("click", () => {
            limpiarFormulario();
        });

        // ========== Cargar y mostrar gatos ==========
        async function cargarGatos() {
            const contenedor = document.getElementById("listaGatos");
            contenedor.innerHTML = `<div class="col-12 loading">Cargando gatos...</div>`;

            try {
                const respuesta = await fetch(`${BACKEND_URL}/gatos`);
                const gatos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(gatos.mensaje || "Error al obtener gatos");
                }

                gatosCargados = gatos;

                if (gatos.length === 0) {
                    contenedor.innerHTML = `
                        <div class="col-12">
                            <div class="alert alert-info text-center">
                                Aún no hay gatos registrados.
                            </div>
                        </div>`;
                    return;
                }

                contenedor.innerHTML = gatos.map(gato => `
                    <div class="col-12 col-sm-6 col-xl-4">
                        <div class="card gato-card h-100">
                            <img src="${escaparHtml(gato.imagenUrl)}" class="card-img-top gato-img" alt="${escaparHtml(gato.nombre)}"
                                 onerror="this.src='https://placehold.co/400x300?text=Sin+imagen'">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title mb-1">${escaparHtml(gato.nombre)}</h5>
                                <p class="card-text mb-1">
                                    <small class="text-muted">
                                        ${escaparHtml(gato.raza)} · ${escaparHtml(gato.edad)} años · ${escaparHtml(gato.peso)} kg
                                    </small>
                                </p>
                                <p class="card-text">
                                    <small class="text-muted">
                                        Registrado: ${new Date(gato.fecha).toLocaleDateString('es-ES')}
                                    </small>
                                </p>
                                <div class="mt-auto d-flex gap-2">
                                    <button class="btn btn-sm btn-outline-primary flex-fill"
                                            onclick="editarGato(gatosCargados.find(g => g.id === '${escaparHtml(gato.id)}'))">
                                        Actualizar
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger flex-fill"
                                            onclick="eliminarGato('${escaparHtml(gato.id)}', '${escaparHtml(gato.nombre)}')">
                                        Eliminar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join("");
            } catch (error) {
                console.error(error);
                contenedor.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger text-center">
                            Error al cargar los gatos. Intenta de nuevo.
                        </div>
                    </div>`;
            }
        }

        // Botón de recargar
        document.getElementById("btnRecargar").addEventListener("click", cargarGatos);

        // ========== Registrar o actualizar (según haya gatoId) ==========
        document.getElementById("formGato").addEventListener("submit", async (e) => {
            e.preventDefault();

            const gatoId = document.getElementById("gatoId").value;
            const editando = gatoId !== "";
            const imagenInput = document.getElementById("imagen");

            // Al registrar, la imagen es obligatoria; al editar es opcional
            if (!editando && imagenInput.files.length === 0) {
                mostrarMensaje("Selecciona una imagen del gato.", "danger");
                return;
            }

            const formData = new FormData();
            formData.append("nombre", document.getElementById("nombre").value.trim());
            formData.append("edad", document.getElementById("edad").value);
            formData.append("peso", document.getElementById("peso").value);
            formData.append("raza", document.getElementById("raza").value.trim());
            if (imagenInput.files.length > 0) {
                formData.append("imagen", imagenInput.files[0]);
            }

            const btnSubmit = document.getElementById("btnSubmit");
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Enviando...";

            try {
                const url = editando ? `${BACKEND_URL}/gato/${gatoId}` : `${BACKEND_URL}/gato`;
                const respuesta = await fetch(url, {
                    method: editando ? "PUT" : "POST",
                    body: formData
                });

                const data = await respuesta.json();

                if (!respuesta.ok) {
                    mostrarMensaje(data.mensaje || "Error al guardar el gato", "danger");
                    btnSubmit.textContent = editando ? "Guardar cambios" : "Registrar Gato";
                    return;
                }

                mostrarMensaje(data.mensaje, "success");
                limpiarFormulario();
                cargarGatos();
            } catch (error) {
                console.error(error);
                mostrarMensaje("Error de conexión con el servidor.", "danger");
                btnSubmit.textContent = editando ? "Guardar cambios" : "Registrar Gato";
            } finally {
                btnSubmit.disabled = false;
            }
        });

        // Cargar gatos al iniciar la página
        cargarGatos();
    </script>
</body>
</html>
