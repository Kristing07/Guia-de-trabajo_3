<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gato</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 18px 36px rgba(0,0,0,0.1);
        }
        #resultado {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h2 class="text-center mb-4">Registro de Gato</h2>
                    <form id="formGato">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" required placeholder="Ej: Michi">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Edad (años)</label>
                            <input type="number" class="form-control" id="edad" required min="0" step="0.1" placeholder="Ej: 2.5">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Peso (kg)</label>
                            <input type="number" class="form-control" id="peso" required min="0" step="0.1" placeholder="Ej: 4.2">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Raza</label>
                            <input type="text" class="form-control" id="raza" required placeholder="Ej: Siames">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Registrar Gato</button>
                    </form>
                    <!-- Mensaje del backend -->
                    <div id="resultado" class="alert alert-success mt-4" role="alert"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Cambia esta URL por la de tu backend en Render
        const BACKEND_URL = "https://guia-de-trabajo-3-9t2e.onrender.com/gatos";

        document.getElementById("formGato").addEventListener("submit", async (e) => {
            e.preventDefault();

            const datos = {
                nombre: document.getElementById("nombre").value.trim(),
                edad: Number(document.getElementById("edad").value),
                peso: Number(document.getElementById("peso").value),
                raza: document.getElementById("raza").value.trim()
            };

            const resultadoDiv = document.getElementById("resultado");
            resultadoDiv.style.display = "none";

            try {
                const respuesta = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos)
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    resultadoDiv.className = "alert alert-success mt-4";
                    resultadoDiv.textContent = data.mensaje;
                } else {
                    resultadoDiv.className = "alert alert-danger mt-4";
                    resultadoDiv.textContent = data.mensaje || "Error al registrar el gato";
                }
                resultadoDiv.style.display = "block";
            } catch (error) {
                resultadoDiv.className = "alert alert-danger mt-4";
                resultadoDiv.textContent = "Error de conexión con el servidor.";
                resultadoDiv.style.display = "block";
            }
        });
    </script>
</body>
</html>
